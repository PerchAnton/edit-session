name: Bug report
description: Report a problem with draft validation, preview, cancellation or commit.
body:
  - type: markdown
    attributes:
      value: |
        A small Rust example or test helps us reproduce the problem. A short
        sequence of calls is enough if you cannot provide a standalone case.
  - type: input
    id: version
    attributes:
      label: edit-session version
      description: Give the release version and Git revision from Cargo.lock, or the source archive name. If it does not build, name the revision you tried.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Rust version (rustc --version), operating system and target triple if cross-compiling.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Code or sequence of actions
      description: |
        Show the initial value, draft changes and calls to check or finish.
        Include changes to the document, target, revision or permissions if
        relevant. For command failures, show when the host command runs and
        how the draft is kept for retry. For build errors, give the Cargo
        dependency entry and command instead.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should the draft, committed value or history contain after these actions?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead? Include the returned error or failed assertion if available.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or example (optional)
      description: Add compiler output, a failing test or a link to a small reproducer. Remove private data before sharing.
