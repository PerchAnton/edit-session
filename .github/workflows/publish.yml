name: Prepare or publish to crates.io
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload with Trusted Publishing (only after the first manual upload)
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: crates-io-publication
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a matching release tag on main for an upload
        if: inputs.publish
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          if os.environ['RELEASE_REF'] != 'refs/tags/v' + version:
              raise SystemExit('Upload requires a tag matching the crate version')
          PY
          git merge-base --is-ancestor HEAD origin/main
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.88.0 test --locked
      - run: cargo +1.88.0 run --locked --example retry_command
      - run: cargo +1.88.0 run --locked --example context_walkthrough
      - run: python3 tools/context_evidence.py --check
      - run: cargo +1.88.0 fmt --check
      - run: cargo +1.88.0 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.88.0 publish --dry-run --locked --registry crates-io
      - run: cargo +1.88.0 package --locked
      - name: Check the packaged tests and record the archive
        run: |
          mkdir packaged
          tar -xzf target/package/edit-session-*.crate -C packaged
          cd packaged/edit-session-*
          cargo +1.88.0 test --locked
          cargo +1.88.0 run --locked --example retry_command
          cargo +1.88.0 run --locked --example context_walkthrough
          python3 tools/context_evidence.py --check
          cd ../..
          sha256sum target/package/*.crate > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crates-io-candidate
          path: |
            target/package/*.crate
            SHA256SUMS
          if-no-files-found: error

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v') && github.repository == 'PerchAnton/edit-session'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/edit-session
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates-io-candidate
          path: verified
      - name: Recheck the archive before requesting a publish token
        run: |
          cargo +1.88.0 publish --dry-run --locked --registry crates-io
          cargo +1.88.0 package --locked
          sha256sum --check verified/SHA256SUMS
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo +1.88.0 publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
