name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        rust: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.rust }} test --locked
      - run: cargo +${{ matrix.rust }} run --locked --example retry_command
      - run: cargo +${{ matrix.rust }} run --locked --example context_walkthrough
      - run: cargo +${{ matrix.rust }} run --locked --example nested_cancel
      - run: cargo +${{ matrix.rust }} run --locked --example canonical_save
      - run: python3 tools/context_evidence.py --check
      - run: cargo +${{ matrix.rust }} fmt --check
      - run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings
      - run: cargo +${{ matrix.rust }} publish --dry-run --locked --registry crates-io
      - run: cargo +${{ matrix.rust }} package --locked
      - name: Test the extracted crate contract
        run: |
          crate_version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          cargo +${{ matrix.rust }} test --locked --manifest-path "target/package/edit-session-$crate_version/Cargo.toml"
  toolkit-boundaries:
    name: Published toolkit boundary recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Install the Slint recipe font dependency
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo +1.99.1 test --locked --manifest-path examples/toolkit-boundaries/Cargo.toml --all-features --jobs 2
      - run: cargo +1.99.1 fmt --manifest-path examples/toolkit-boundaries/Cargo.toml --check
      - run: cargo +1.99.1 clippy --locked --manifest-path examples/toolkit-boundaries/Cargo.toml --all-features --all-targets -- -D warnings
