name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.rust }} test --locked
      - run: cargo +${{ matrix.rust }} fmt --check
      - run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings
