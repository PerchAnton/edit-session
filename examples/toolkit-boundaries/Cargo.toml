[package]
name = "edit-session-toolkit-boundaries"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
edit-session = "=1.0.0"
dioxus-core = "=0.7.10"
dioxus-signals = "=0.7.10"
yew = { version = "=0.23.0", default-features = false }
sycamore-reactive = "=0.9.4"
vizia_id = "=0.4.0"
iced_runtime = "=0.14.0"
futures = "=0.3.31"
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18"] }
tuirealm = { version = "=4.1.0", default-features = false, features = ["crossterm"] }

tachyonfx = { version = "=0.25.2", default-features = false, features = ["std"] }
ratatui-core = "=0.1.2"

[profile.dev]
debug = 0
strip = "none"
incremental = false
