<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="362" viewBox="0 0 1040 362" role="img" aria-labelledby="title description">
  <title id="title">A checked draft is not an applied command</title>
  <desc id="description">The application validates input. edit-session checks live value, context and proposal, then finish consumes the session and returns an error, no change or a Change. The application owns permissions, command execution, history and recovery after an execution error. Native Rust tests can verify the library without interaction-check.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#526176"/></marker></defs>
  <rect width="1040" height="362" rx="20" fill="#f4f7fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="38" font-size="14" fill="#526176" font-weight="700">EDIT-SESSION / INTEGRATION CONTRACT</text>
    <text x="32" y="80" font-size="30" fill="#172438" font-weight="700">A checked draft is not an applied command.</text>
    <rect x="32" y="112" width="290" height="126" rx="14" fill="#ffffff" stroke="#dce3ec"/>
    <text x="54" y="143" font-size="15" fill="#526176" font-weight="700">APPLICATION</text>
    <text x="54" y="177" font-size="23" fill="#172438" font-weight="700">Validate the input</text>
    <text x="54" y="207" font-size="16" fill="#526176">Parse, check bounds, propose</text>
    <path d="M330 176 H358" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="368" y="112" width="298" height="126" rx="14" fill="#e4f5f0" stroke="#9acfc4"/>
    <text x="390" y="143" font-size="15" fill="#087c79" font-weight="700">EDIT-SESSION</text>
    <text x="390" y="177" font-size="23" fill="#172438" font-weight="700">Check, then finish</text>
    <text x="390" y="207" font-size="16" fill="#526176">Value + context + valid input</text>
    <path d="M674 176 H702" stroke="#526176" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="712" y="112" width="296" height="126" rx="14" fill="#ffffff" stroke="#dce3ec"/>
    <text x="734" y="143" font-size="15" fill="#526176" font-weight="700">APPLICATION</text>
    <text x="734" y="177" font-size="23" fill="#172438" font-weight="700">Apply the command</text>
    <text x="734" y="207" font-size="16" fill="#526176">Permissions, history, recovery</text>
    <text x="32" y="275" font-size="17" fill="#172438" font-weight="700">finish() consumes the session, including when it returns an error.</text>
    <text x="32" y="305" font-size="16" fill="#526176">Use check() to keep invalid input editable. A later command error needs host-owned recovery.</text>
    <text x="32" y="335" font-size="15" fill="#087c79">Native Rust tests verify the library. UI / command integration needs its own tests.</text>
  </g>
</svg>
