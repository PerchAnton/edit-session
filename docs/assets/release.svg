<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="496" viewBox="0 0 1040 496" role="img" aria-labelledby="title description">
<title id="title">Keep the draft. Retry safely.</title>
<desc id="description">A tested host workflow using the existing draft API. Release alpha.4, 27 October 2026 (Europe/Kyiv). 0 runtime dependencies Rust 1.88+ · no_std library; 25 passing scoped checks 16 lifecycle + 8 host + 1 doctest; 34.2 KiB source crate download 35,058 bytes · compressed archive. Workflow: 1 / CHECK Check the live state Validate input, document, target and revision on each try.; 2 / APPLY Try the host command The host owns permissions and atomic command rejection.; 3 / RECOVER Keep or close Rejected: retain fields + draft. Succeeded: close the editor..</desc>
